name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Enforce 100% unit test coverage
        if: ${{ !cancelled() && matrix.node-version == '24' }}
        run: pnpm test:coverage
      - name: Summarize coverage
        if: ${{ !cancelled() && matrix.node-version == '24' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";
          const path = "coverage/coverage-summary.json";
          if (!existsSync(path)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Code coverage\n\nNo coverage report was generated. Check the test logs.\n");
            process.exit(0);
          }
          const { total } = JSON.parse(readFileSync(path, "utf8"));
          const rows = ["lines", "statements", "functions", "branches"].map((metric) => {
            const { pct, covered, total: count } = total[metric];
            return `| ${metric} | ${pct}% | ${covered}/${count} |`;
          });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "## Code coverage",
            "",
            "| Metric | Coverage | Covered / Total |",
            "| --- | --- | --- |",
            ...rows,
            "",
            "Required: 100% lines, statements, functions, and branches for every source file.",
            "Coverage includes src/**/*.ts executed inside Vitest. Spawned CLI subprocesses are not captured.",
            "Download the coverage-report artifact and open index.html for the file-level report.",
            "",
          ].join("\n"));
          NODE
      - name: Upload coverage report
        if: ${{ !cancelled() && matrix.node-version == '24' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
